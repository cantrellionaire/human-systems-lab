<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta id="themeColor" name="theme-color" content="#01070d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Human Systems Lab">
  <title>Human Systems Lab</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-wolf-round-32.png">
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon-wolf-round.svg">
  <link rel="apple-touch-icon" href="favicon-wolf-round-192.png">

  <style>
    :root {
      --mcc-blue: #004b8d;
      --mcc-gold: #ffc20e;
      --bg: #eef3f8;
      --ink: #222;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Palatino Linotype", Palatino, serif;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
    }

    .shell {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .appbar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: max(8px, env(safe-area-inset-top)) 12px 8px;
      background: var(--mcc-blue);
      color: #fff;
      border-bottom: 4px solid var(--mcc-gold);
      box-shadow: 0 2px 10px rgba(0,0,0,.16);
      z-index: 5;
    }

    .appbar img {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      object-fit: cover;
    }

    .title {
      font-weight: 700;
      font-size: 17px;
      line-height: 1.15;
      flex: 1;
    }

    .subtitle {
      font-size: 11px;
      opacity: .86;
      margin-top: 2px;
    }

    #installBtn {
      display: none;
      border: 0;
      border-radius: 8px;
      background: var(--mcc-gold);
      color: #222;
      font: inherit;
      font-weight: 700;
      padding: 7px 10px;
      cursor: pointer;
    }

    .frame-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #fff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    .offline {
      display: none;
      position: absolute;
      inset: 0;
      padding: 28px;
      background: var(--bg);
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 10;
    }

    .offline img {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      margin-bottom: 16px;
    }

    .offline h1 {
      color: var(--mcc-blue);
      font-size: 24px;
      margin: 0 0 8px;
    }

    .offline p {
      max-width: 520px;
      margin: 0;
      line-height: 1.5;
    }

    body.is-offline .offline { display: flex; }
    body.is-offline iframe { visibility: hidden; }

    @media (display-mode: standalone) {
      .appbar {
        padding-top: max(10px, env(safe-area-inset-top));
      }
    }
  
    /* =========================================================
       CINEMATIC STARTUP
       Visible from the first HTML paint so the Netlify shell
       never exposes the white iframe while Apps Script starts.
       ========================================================= */
    body.booting {
      background: #01070d;
    }

    body.booting .shell {
      opacity: 0;
      visibility: hidden;
    }

    body:not(.booting) .shell {
      opacity: 1;
      visibility: visible;
      transition: opacity .42s ease;
    }

    .boot-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(26,129,199,.24), transparent 22%),
        radial-gradient(circle at 50% 50%, rgba(1,12,24,.84), #01070d 72%);
      opacity: 1;
      visibility: visible;
      transition: opacity .58s cubic-bezier(.2,.8,.2,1), visibility .58s ease;
    }

    .boot-loader.revealing {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-space {
      position: absolute;
      inset: -20%;
      background:
        repeating-radial-gradient(circle at center, rgba(79,199,255,.10) 0 1px, transparent 1px 34px),
        conic-gradient(from 0deg at 50% 50%,
          transparent 0 12deg,
          rgba(53,185,255,.05) 14deg 18deg,
          transparent 20deg 38deg,
          rgba(255,194,14,.04) 40deg 43deg,
          transparent 45deg 360deg);
      animation: bootSpaceSpin 16s linear infinite;
      transform: scale(1.2);
      opacity: .65;
    }

    .boot-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 260px;
      height: 260px;
      margin: -130px 0 0 -130px;
      border-radius: 50%;
      border: 1px solid rgba(95,221,255,.48);
      box-shadow:
        0 0 34px rgba(53,185,255,.18),
        inset 0 0 28px rgba(53,185,255,.07);
    }

    .boot-ring.one {
      animation: bootRingPulse .9s ease-in-out infinite alternate;
    }

    .boot-ring.two {
      width: 380px;
      height: 380px;
      margin: -190px 0 0 -190px;
      border-style: dashed;
      border-color: rgba(255,194,14,.34);
      animation: bootRingSpin 4.8s linear infinite;
    }

    .boot-ring.three {
      width: 520px;
      height: 520px;
      margin: -260px 0 0 -260px;
      border-color: rgba(81,184,244,.16);
      animation: bootRingSpinReverse 7.2s linear infinite;
    }

    .boot-core {
      position: relative;
      z-index: 2;
      width: min(520px, 84vw);
      text-align: center;
      color: #fff;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .boot-mark {
      width: 82px;
      height: 82px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(255,194,14,.65);
      background:
        radial-gradient(circle at 35% 30%, rgba(53,185,255,.24), rgba(4,21,36,.92) 62%);
      color: #ffd45f;
      font: bold 25px/1 Georgia, serif;
      letter-spacing: .08em;
      box-shadow:
        0 0 0 12px rgba(53,185,255,.035),
        0 0 34px rgba(53,185,255,.22),
        inset 0 0 22px rgba(255,194,14,.06);
      animation: bootCoreFloat 1.8s ease-in-out infinite;
    }

    .boot-core strong {
      display: block;
      margin-bottom: 7px;
      color: #e8f8ff;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: .22em;
      text-shadow: 0 0 22px rgba(53,185,255,.25);
    }

    .boot-core > span {
      display: block;
      color: #93bed9;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.5;
      letter-spacing: .08em;
    }

    .boot-progress {
      width: min(330px, 70vw);
      height: 3px;
      margin: 18px auto 0;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(105,184,230,.12);
    }

    .boot-progress span {
      display: block;
      width: 12%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2ab7f4 0%, #4dd3ff 62%, #ffc20e 100%);
      box-shadow: 0 0 14px rgba(53,185,255,.55);
      transition: width .62s cubic-bezier(.2,.75,.2,1);
      position: relative;
    }

    .boot-progress span::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 38px;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.9));
      filter: blur(1px);
      opacity: .8;
    }

    body.is-offline .boot-loader {
      display: none;
    }

    body.is-offline .shell {
      opacity: 1 !important;
      visibility: visible !important;
    }

    @keyframes bootSpaceSpin {
      to { transform: scale(1.2) rotate(360deg); }
    }

    @keyframes bootRingSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes bootRingSpinReverse {
      to { transform: rotate(-360deg); }
    }

    @keyframes bootRingPulse {
      from { transform: scale(.94); opacity: .48; }
      to { transform: scale(1.04); opacity: 1; }
    }

    @keyframes bootCoreFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @media (max-width: 560px) {
      .boot-ring.one {
        width: 230px;
        height: 230px;
        margin: -115px 0 0 -115px;
      }
      .boot-ring.two {
        width: 340px;
        height: 340px;
        margin: -170px 0 0 -170px;
      }
      .boot-ring.three {
        width: 470px;
        height: 470px;
        margin: -235px 0 0 -235px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-space,
      .boot-ring,
      .boot-mark {
        animation: none !important;
      }

      .boot-progress span {
        transition-duration: .01ms !important;
      }
    }


    /* Keep the wolf fixed at the rings' shared center. */
    .boot-core { position:absolute; left:50%; top:50%; height:0;
      transform:translate(-50%,-50%); }
    .boot-mark { position:absolute; left:50%; top:0; margin:0;
      transform:translate(-50%,-50%); animation:none; border:0;
      background:transparent; border-radius:50%; overflow:hidden; }
    .boot-mark img { display:block; width:100%; height:100%; object-fit:contain; }
    .boot-core > strong { position:absolute; left:0; top:66px; width:100%; margin:0; }
    .boot-core > span { position:absolute; left:0; top:112px; width:100%; margin:0; }
    .boot-core > .boot-progress { position:absolute; left:50%; top:146px;
      transform:translateX(-50%); margin:0; }
  </style>
</head>

<body class="booting">

  <div id="bootLoader" class="boot-loader" aria-live="polite" aria-label="Human Systems Lab loading">
    <div class="boot-space"></div>
    <div class="boot-ring one"></div>
    <div class="boot-ring two"></div>
    <div class="boot-ring three"></div>
    <div class="boot-core">
      <div class="boot-mark"><img src="icon-192.png" alt="Human Systems Lab" width="82" height="82" decoding="sync" fetchpriority="high"></div>
      <strong id="bootTitle">INITIALIZING HUMAN SYSTEMS LAB</strong>
      <span id="bootSubtitle">Loading course workspace</span>
      <div class="boot-progress" role="progressbar" aria-label="Loading Human Systems Lab" aria-valuemin="0" aria-valuemax="100" aria-valuenow="12"><span id="bootProgressFill" style="width:12%"></span></div>
    </div>
  </div>

  <div class="shell">
    <header class="appbar">
      <img src="icon-192.png" alt="">
      <div>
        <div class="title">Human Systems Lab</div>
        <div class="subtitle">Psychology • Human Development • Business</div>
      </div>
      <button id="installBtn" type="button">Install</button>
    </header>

    <main class="frame-wrap">
      <iframe
        id="hslFrame"
        title="Human Systems Lab"
        src="https://script.google.com/macros/s/AKfycbx9LgOYRwNARk8RnTq2HpjJsvsCc1jVIx18eDUMV8aSddozHoDYcdX26ODqK1Ub0wkUAA/exec?course=LC&offering=LC-1100&fx=cinematic"
        allow="clipboard-read; clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>

      <div class="offline" id="offlinePanel">
        <img src="icon-192.png" alt="Human Systems Lab">
        <h1>Human Systems Lab</h1>
        <p>
          The app shell is installed, but the live course tools need an internet connection.
          Reconnect and reopen the app.
        </p>
      </div>
    </main>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }

    const bootLoader = document.getElementById('bootLoader');
    const bootTitle = document.getElementById('bootTitle');
    const bootSubtitle = document.getElementById('bootSubtitle');
    const bootProgressFill = document.getElementById('bootProgressFill');
    const bootProgress = document.querySelector('.boot-progress');
    const hslFrame = document.getElementById('hslFrame');
    const themeColor = document.getElementById('themeColor');

    let frameLoaded = false;
    let hubReady = false;
    let bootFinished = false;
    let fallbackTimer = null;

    function setBootProgress(value, subtitle) {
      const pct = Math.max(0, Math.min(100, Number(value) || 0));
      if (bootProgressFill) bootProgressFill.style.width = pct + '%';
      if (bootProgress) bootProgress.setAttribute('aria-valuenow', String(Math.round(pct)));
      if (subtitle && bootSubtitle) bootSubtitle.textContent = subtitle;
    }

    // Milestone 1: the Netlify shell and startup UI are now in memory.
    setBootProgress(25, 'Preparing secure workspace');

    function completeBoot() {
      if (bootFinished || !navigator.onLine) return;
      bootFinished = true;
      hubReady = true;

      if (fallbackTimer) {
        clearTimeout(fallbackTimer);
        fallbackTimer = null;
      }

      setBootProgress(100, 'Opening Human Systems Lab');
      if (bootTitle) bootTitle.textContent = 'HUMAN SYSTEMS LAB // ONLINE';

      // Let the user actually see 100% briefly, then reveal the already-ready Hub.
      window.setTimeout(() => {
        document.body.classList.remove('booting');
        if (themeColor) themeColor.setAttribute('content', '#004b8d');

        window.setTimeout(() => {
          if (bootLoader) bootLoader.classList.add('revealing');
        }, 80);
      }, 120);
    }

    function handleFrameLoad() {
      if (!navigator.onLine || bootFinished) return;
      frameLoaded = true;

      // Milestone 2: Apps Script HTML has loaded. The Hub is now fetching and
      // rendering its course configuration, calendar, tools, and offering.
      setBootProgress(68, 'Loading course data');

      // The Hub has its own readiness-controlled loader. Reveal that frame
      // as soon as it loads instead of adding a second 12-second wait.
      completeBoot();
    }

    if (hslFrame) {
      hslFrame.addEventListener('load', handleFrameLoad);
    }

    window.addEventListener('message', (event) => {
      if (!hslFrame || event.source !== hslFrame.contentWindow) return;
      const data = event.data || {};
      if (data.type !== 'HSL_HUB_READY') return;

      // Milestone 3: the Hub itself confirms the LC workspace has rendered.
      setBootProgress(88, 'Activating course workspace');
      window.setTimeout(completeBoot, 220);
    });

    function updateOnlineState() {
      const offline = !navigator.onLine;
      document.body.classList.toggle('is-offline', offline);

      if (offline) {
        document.body.classList.remove('booting');
        if (themeColor) themeColor.setAttribute('content', '#004b8d');
      } else if (!bootFinished) {
        document.body.classList.add('booting');
        if (themeColor) themeColor.setAttribute('content', '#01070d');

        if (!frameLoaded) {
          setBootProgress(25, 'Preparing secure workspace');
        }
      }
    }

    window.addEventListener('online', updateOnlineState);
    window.addEventListener('offline', updateOnlineState);
    updateOnlineState();

    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.style.display = 'inline-block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      deferredPrompt = null;
    });
  </script>
</body>
</html>
